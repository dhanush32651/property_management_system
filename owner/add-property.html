<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Property</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="../css/dashboard.css">

</head>


<body>


    <aside class="sidebar">

        <div class="sidebar-logo">

            <img src="../assets/images/logo.png">

            <span>Property Manager</span>

        </div>


        <nav class="sidebar-nav">

            <a href="dashboard.html">
                📊 Dashboard
            </a>

            <a href="properties.html"
               class="active">
                🏠 Properties
            </a>

            <a href="tenants.html">
                👥 Tenants
            </a>

            <a href="payments.html">
                💰 Payments
            </a>

            <a href="leases.html">
                📄 Leases
            </a>

            <a href="../communication/messages.html">
                💬 Messages
            </a>

        </nav>

    </aside>


    <main class="dashboard-main">


        <header class="dashboard-header">

            <div>

                <h1>Add Property</h1>

                <p>
                    Add a new property to your account
                </p>

            </div>

        </header>


        <section class="form-section">


            <form id="propertyForm"
                  class="property-form">


                <div class="form-group">

                    <label>Property Name</label>

                    <input
                        type="text"
                        id="propertyName"
                        placeholder="Example: Green Villa"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Location</label>

                    <input
                        type="text"
                        id="propertyLocation"
                        placeholder="Example: Hyderabad"
                        required
                    >

                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label>Property Type</label>

                        <select id="propertyType">

                            <option>
                                Villa
                            </option>

                            <option>
                                Apartment
                            </option>

                            <option>
                                House
                            </option>

                            <option>
                                Commercial
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Monthly Rent</label>

                        <input
                            type="number"
                            id="propertyRent"
                            placeholder="25000"
                            required
                        >

                    </div>


                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label>Bedrooms</label>

                        <input
                            type="number"
                            id="propertyBedrooms"
                            placeholder="3"
                            min="0"
                        >

                    </div>


                    <div class="form-group">

                        <label>Status</label>

                        <select id="propertyStatus">

                            <option value="Available">
                                Available
                            </option>

                            <option value="Rented">
                                Rented
                            </option>

                        </select>

                    </div>


                </div>


                <div class="form-group">

                    <label>Description</label>

                    <textarea
                        id="propertyDescription"
                        rows="5"
                        placeholder="Enter property description..."
                    ></textarea>

                </div>


                <div class="form-actions">

                    <a
                        href="properties.html"
                        class="cancel-button">
                        Cancel
                    </a>

                    <button type="submit">
                        Add Property
                    </button>

                </div>


            </form>


        </section>


    </main>


    <script src="../js/main.js"></script>
    <script src="../js/owner.js"></script>

</body>
</html>
