<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Property</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="../css/dashboard.css">

</head>


<body>


    <aside class="sidebar">

        <div class="sidebar-logo">

            <img src="../assets/images/logo.png">

            <span>Property Manager</span>

        </div>


        <nav class="sidebar-nav">

            <a href="dashboard.html">
                📊 Dashboard
            </a>

            <a href="property.html"
               class="active">
                🏠 My Property
            </a>

            <a href="payments.html">
                💰 Payments
            </a>

            <a href="lease.html">
                📄 My Lease
            </a>

            <a href="../communication/messages.html">
                💬 Messages
            </a>

        </nav>

    </aside>


    <main class="dashboard-main">


        <header class="dashboard-header">

            <div>

                <h1>My Property</h1>

                <p>
                    Property details
                </p>

            </div>

        </header>


        <section class="property-detail">


            <img
                src="../assets/images/villa.jpg"
                alt="Green Villa"
            >


            <div class="property-detail-content">

                <span class="status-badge">
                    Active
                </span>

                <h1>Green Villa</h1>

                <p>📍 Hyderabad</p>

                <p>
                    A comfortable villa with modern
                    facilities and convenient access
                    to nearby locations.
                </p>


                <div class="detail-grid">

                    <div>

                        <span>Property Type</span>

                        <strong>
                            Villa
                        </strong>

                    </div>


                    <div>

                        <span>Bedrooms</span>

                        <strong>
                            3
                        </strong>

                    </div>


                    <div>

                        <span>Monthly Rent</span>

                        <strong>
                            ₹25,000
                        </strong>

                    </div>


                    <div>

                        <span>Location</span>

                        <strong>
                            Hyderabad
                        </strong>

                    </div>

                </div>


            </div>


        </section>


    </main>


</body>
</html>
