<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Property Manager</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/login.css">

</head>


<body class="auth-body">


    <div class="auth-container">


        <div class="auth-image">

            <img
                src="assets/images/hero-property.jpg"
                alt="Property"
            >

            <div class="auth-image-text">

                <h2>Welcome Back!</h2>

                <p>
                    Manage your properties from one place.
                </p>

            </div>

        </div>


        <div class="auth-form">

            <div class="auth-logo">

                <img
                    src="assets/images/logo.png"
                    alt="Logo"
                >

                <h2>Property Manager</h2>

            </div>


            <h1>Login</h1>

            <p class="auth-subtitle">
                Enter your details to continue
            </p>


            <form id="loginForm">


                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <label>Login As</label>

                <select id="loginRole">

                    <option value="owner">
                        Owner / Manager
                    </option>

                    <option value="tenant">
                        Tenant
                    </option>

                </select>


                <button type="submit">
                    Login
                </button>


            </form>


            <p class="auth-bottom">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>


            <a href="index.html"
               class="back-home">
                ← Back to Home
            </a>


        </div>

    </div>


    <script src="js/login.js"></script>

</body>
</html>
