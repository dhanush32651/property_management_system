<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Property Manager</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/login.css">

</head>


<body class="auth-body">


    <div class="register-card">


        <div class="auth-logo">

            <img
                src="assets/images/logo.png"
                alt="Logo"
            >

            <h2>Property Manager</h2>

        </div>


        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Register to manage your rental information
        </p>


        <form id="registerForm">


            <label>Full Name</label>

            <input
                type="text"
                id="registerName"
                placeholder="Enter your full name"
                required
            >


            <label>Email</label>

            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Create a password"
                required
            >


            <label>Register As</label>

            <select id="registerRole">

                <option value="owner">
                    Owner / Manager
                </option>

                <option value="tenant">
                    Tenant
                </option>

            </select>


            <button type="submit">
                Create Account
            </button>


        </form>


        <p class="auth-bottom">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <a href="index.html"
           class="back-home">
            ← Back to Home
        </a>


    </div>


    <script src="js/register.js"></script>

</body>
</html>
